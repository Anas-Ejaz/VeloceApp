name: veloce
description: Veloce - Premium Automotive Subscription App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

  # UI Components
  smooth_page_indicator: ^2.0.1
  cached_network_image: ^3.3.0
  fl_chart: ^0.66.2
  animate_do: ^3.3.4
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  provider: ^6.1.1
  go_router: ^12.1.1
  cloud_firestore: ^5.6.12
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

